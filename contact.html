    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* 1. COPIE MAGIQUE DANS LE PRESSE-PAPIERS */
            const copyItems = document.querySelectorAll('[data-copy]');
            copyItems.forEach(item => {
                item.addEventListener('click', async () => {
                    const text = item.getAttribute('data-copy');
                    try {
                        await navigator.clipboard.writeText(text);
                        const tooltip = item.querySelector('.copy-tooltip');
                        tooltip.classList.add('active');
                        setTimeout(() => tooltip.classList.remove('active'), 2000);
                    } catch (err) {
                        console.error('Erreur de copie', err);
                    }
                });
            });

            /* 2. EFFET 3D PARALLAX SUR LA CARTE */
            const card = document.querySelector('.tilt-card');
            if (window.matchMedia("(min-width: 768px)").matches) {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -10;
                    const rotateY = ((x - centerX) / centerX) * 10;

                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                    
                    // Reflet dynamique
                    const angle = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI) - 90;
                    card.style.background = `
                        linear-gradient(${angle}deg, 
                            rgba(255, 255, 255, 0.1) 0%, 
                            rgba(212, 175, 55, 0.15) 30%, 
                            rgba(5, 5, 5, 1) 80%
                        ),
                        #050505
                    `;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = `rotateX(0deg) rotateY(0deg)`;
                    card.style.background = `linear-gradient(145deg, #151515 0%, #050505 100%)`;
                });
            }

            /* 3. ARRIÈRE-PLAN ONDES RADIO (NETWORKING) */
            const canvas = document.getElementById('comm-waves');
            const ctx = canvas.getContext('2d');
            let waves = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Wave {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.r = 1;
                    this.opacity = 0.6;
                    this.maxR = Math.random() * 150 + 50;
                    this.speed = Math.random() * 0.4 + 0.2;
                }
                update() {
                    this.r += this.speed;
                    this.opacity -= 0.003;
                    if (this.opacity <= 0) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(212, 175, 55, ${this.opacity})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            function init() {
                waves = [];
                for(let i=0; i<20; i++) waves.push(new Wave());
            }

            function anim() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                waves.forEach(w => { w.update(); w.draw(); });
                requestAnimationFrame(anim);
            }
            init();
            anim();

            /* 4. ONDES DE CLIC (RIPPLE GLOBAL) */
            window.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = `${e.clientX}px`;
                ripple.style.top = `${e.clientY}px`;
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
